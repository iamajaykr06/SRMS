        <!-- Mobile Button -->
        <button id="menuBtn" class="md:hidden text-white/80 hover:text-white hover:bg-white/10 p-2 rounded-lg transition-all duration-300 group">
            <div class="flex flex-col gap-1.5">
                <span class="block w-6 h-0.5 bg-current transition-all duration-300 group-hover:bg-yellow-300"></span>

    </div>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="hidden md:hidden px-6 pb-4 space-y-3 text-sm font-medium">
        <a href="index.html" class="block text-white/80 hover:text-white hover:bg-white/10 px-3 py-2 rounded-lg transition-all duration-300 group">
            <span class="flex items-center gap-2">
                <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>

            <span class="flex items-center gap-2">
                <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>

        <a href="Notice.html" class="block text-white/80 hover:text-white hover:bg-white/10 px-3 py-2 rounded-lg transition-all duration-300 group">
            <span class="flex items-center gap-2">
                <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-5 5v-5z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 7H4a2 2 0 00-2 2v10a2 2 0 002 2h6a2 2 0 002-2V9a2 2 0 00-2-2z"></path>

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>

</header>

<script>
    // Enhanced mobile menu functionality with active page detection
    const btn = document.getElementById("menuBtn");
    const menu = document.getElementById("mobileMenu");
    let isOpen = false;
    
    btn.addEventListener("click", () => {
        isOpen = !isOpen;
        
        // Animate hamburger menu
        if (isOpen) {
            menuIcon.classList.add('open');
            menu.classList.remove('hidden');
            menu.classList.add('animate-fadeIn');
        } else {
            menuIcon.classList.remove('open');
            menu.classList.add('hidden');
            menu.classList.remove('animate-fadeIn');
        }
    });
    
    // Close menu when clicking outside
    document.addEventListener("click", (e) => {
        if (isOpen && !btn.contains(e.target) && !menu.contains(e.target)) {
            isOpen = false;
            menuIcon.classList.remove('open');
            menu.classList.add('hidden');
            menu.classList.remove('animate-fadeIn');
        }
    });
    
    // Add scroll effect to navbar
    let lastScroll = 0;
    const header = document.querySelector('header');
    
    window.addEventListener('scroll', () => {
        const currentScroll = window.pageYOffset;
        
        if (currentScroll > 100) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }
        
        lastScroll = currentScroll;
    });
    
    // Active page detection and highlighting
    function setActivePage() {
        const currentPage = window.location.pathname.split('/').pop() || 'index';
        const navLinks = document.querySelectorAll('nav a');
        
        navLinks.forEach(link => {
            const href = link.getAttribute('href');
            const pageName = href.split('/').pop() || 'index';
            
            // Remove all active states
            link.classList.remove('bg-yellow-400/20', 'text-yellow-300');
            const overlay = link.querySelector('.absolute');
            if (overlay) {
                overlay.classList.remove('bg-yellow-400/20');
            }
            
            // Add active state to current page
            if (pageName === currentPage) {
                link.classList.add('bg-yellow-400/20', 'text-yellow-300');
                const overlay = link.querySelector('.absolute');
                if (overlay) {
                    overlay.classList.add('bg-yellow-400/20');
                }
            }
        });
    }
    
    // Initialize active page detection
    setActivePage();
    
    // Update active page on navigation
    document.addEventListener('DOMContentLoaded', () => {
        const navLinks = document.querySelectorAll('nav a');
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                setTimeout(setActivePage, 100); // Small delay to ensure page transition completes
            });
        });
    });
    
    // Add CSS for animations and active states
    const style = document.createElement('style');
    style.textContent = `
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .open span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        
        .open span:nth-child(2) {
            opacity: 0;
        }
        
        .open span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -6px);
        }
        
        header.scrolled {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
    `;
    document.head.appendChild(style);
</script>
