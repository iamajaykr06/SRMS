<!-- HEADER -->
<header class="w-full fixed top-0 z-50 bg-white/10 backdrop-blur-xl border-b border-white/20 text-white shadow-lg transition-all duration-300">

    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">

        <!-- Logo -->
        <a href="/" class="flex items-center gap-3 group">
            <div class="relative w-14 h-14 rounded-full overflow-hidden bg-white/10 backdrop-blur-xl border border-white/20 p-2 transition-all duration-300 group-hover:bg-white/20 group-hover:border-yellow-400/50 group-hover:scale-110">

                <div class="absolute inset-0 bg-gradient-to-br from-yellow-400/20 to-transparent rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </div>
            <div class="leading-tight">
                <h1 class="text-lg font-bold text-white/90 transition-colors duration-300 group-hover:text-yellow-300">Jharkhand Rai University</h1>
                <p class="text-sm text-white/70 transition-colors duration-300 group-hover:text-white/90">Ranchi, Jharkhand</p>
            </div>
        </a>

        <!-- Desktop Nav -->
        <nav class="hidden md:flex gap-8 text-sm font-medium">
            <a href="/" class="nav-link relative text-white/80 hover:text-white hover:bg-white/10 px-4 py-2 rounded-lg transition-all duration-300 group">
                <span class="relative z-10">Home</span>
                <div class="absolute inset-0 bg-gradient-to-r from-yellow-400/20 to-transparent rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </a>
            <a href="/results" class="nav-link relative text-white/80 hover:text-white hover:bg-white/10 px-4 py-2 rounded-lg transition-all duration-300 group">
                <span class="relative z-10">Results</span>
                <div class="absolute inset-0 bg-gradient-to-r from-yellow-400/20 to-transparent rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </a>
            <a href="/notices" class="nav-link relative text-white/80 hover:text-white hover:bg-white/10 px-4 py-2 rounded-lg transition-all duration-300 group">

                <div class="absolute inset-0 bg-gradient-to-r from-yellow-400/20 to-transparent rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </a>
            <a href="/contact" class="nav-link relative text-white/80 hover:text-white hover:bg-white/10 px-4 py-2 rounded-lg transition-all duration-300 group">

                <div class="absolute inset-0 bg-gradient-to-r from-yellow-400/20 to-transparent rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </a>
        </nav>

        <!-- Mobile Button -->
        <button id="menuBtn" class="md:hidden text-white/80 hover:text-white hover:bg-white/10 p-2 rounded-lg transition-all duration-300 group">
            <div class="flex flex-col gap-1.5">
                <span class="block w-6 h-0.5 bg-current transition-all duration-300 group-hover:bg-yellow-300"></span>
                <span class="block w-6 h-0.5 bg-current transition-all duration-300 group-hover:bg-yellow-300"></span>
                <span class="block w-6 h-0.5 bg-current transition-all duration-300 group-hover:bg-yellow-300"></span>
            </div>
        </button>

    </div>
